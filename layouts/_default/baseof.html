<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }} – {{ .Site.Params.slogan }}{{ else }}{{ partial "baslik.html" . | htmlEscape }} – {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="color-scheme" content="light dark">
  {{ with .Site.Home.OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ $.Site.Title }}">{{ end }}
  {{ with .Site.Home.OutputFormats.Get "JSONFeed" }}<link rel="alternate" type="application/feed+json" href="{{ .Permalink }}" title="{{ $.Site.Title }}">{{ end }}
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">
  <link rel="canonical" href="{{ .Permalink }}">
</head>
<body>
  <a class="atla" href="#icerik">İçeriğe geç</a>
  {{ partial "header.html" . }}
  <main id="icerik" class="kap">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
